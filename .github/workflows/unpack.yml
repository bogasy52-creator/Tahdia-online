name: Auto Update Game

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-zip-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Find uploaded ZIP
        id: upload
        shell: bash
        run: |
          if [ -z "$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)" ]; then
            echo "zip=" >> "$GITHUB_OUTPUT"
            echo "Workflow installed. Upload a patch ZIP to apply an update."
            exit 0
          fi
          ZIP=$(bash .github/scripts/find-uploaded-zip.sh)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Apply full release or verified sparse patch
        if: steps.upload.outputs.zip != ''
        shell: bash
        env:
          UPLOAD_ZIP: ${{ steps.upload.outputs.zip }}
        run: |
          set -euo pipefail
          if python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); sys.exit(0 if "patch-manifest.json" in z.namelist() else 1)' "$UPLOAD_ZIP"; then
            python3 - "$UPLOAD_ZIP" tahadi-alabaqera-online-pro-fixed <<'PATCH_PY'
          """Apply a checksummed sparse patch while preserving deployed Worker settings."""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import sys
          import tempfile
          import zipfile

          def apply_patch(archive_path, target_path, check_only=False):
              archive_path=Path(archive_path).resolve()
              target=Path(target_path).resolve()
              if not target.is_dir() or not (target/'package.json').is_file():
                  raise ValueError('The existing game project was not found.')
              with zipfile.ZipFile(archive_path) as archive:
                  entries=archive.infolist()
                  if len(entries)>2000 or sum(e.file_size for e in entries)>150*1024*1024:
                      raise ValueError('Patch is too large.')
                  names=[e.filename for e in entries]
                  if len(set(names))!=len(names):
                      raise ValueError('Duplicate archive paths.')
                  for entry in entries:
                      path=PurePosixPath(entry.filename)
                      if path.is_absolute() or '..' in path.parts or '\\' in entry.filename or ':' in entry.filename:
                          raise ValueError('Unsafe archive path.')
                      if stat.S_ISLNK(entry.external_attr >> 16):
                          raise ValueError('Symbolic links are not allowed.')
                  manifest=json.loads(archive.read('patch-manifest.json'))
                  if manifest.get('format')!='busraj-sparse-patch-v1' or manifest.get('target')!='tahadi-alabaqera-online-pro-fixed':
                      raise ValueError('Unsupported patch format or project.')
                  version=json.loads((target/'package.json').read_text())['version']
                  if version not in manifest['supported_versions']:
                      raise ValueError('Unsupported installed version: '+str(version))
                  files=manifest['files']
                  expected={'patch-manifest.json','PATCH_INSTRUCTIONS_AR.md'}
                  payload=[]
                  for item in files:
                      relative=PurePosixPath(item['path'])
                      if str(relative)!=item['path']:
                          raise ValueError('Noncanonical patch destination.')
                      if relative.is_absolute() or '..' in relative.parts or '\\' in item['path'] or ':' in item['path']:
                          raise ValueError('Unsafe destination path.')
                      if relative.parts[0] in {'.git','node_modules','.wrangler','.github'} or item['path']=='wrangler.jsonc':
                          raise ValueError('Patch attempted to change protected deployment settings.')
                      name='game-patch/'+item['path']
                      if name in expected:
                          raise ValueError('Duplicate patch destination.')
                      expected.add(name)
                      destination=target.joinpath(*relative.parts)
                      if any(parent.is_symlink() for parent in (destination,*destination.parents) if parent!=target):
                          raise ValueError('Symbolic-link destinations are not allowed.')
                      if not destination.resolve().is_relative_to(target) or destination.is_symlink():
                          raise ValueError('Destination escapes the existing game.')
                      data=archive.read(name)
                      digest=hashlib.sha256(data).hexdigest()
                      if digest!=item['sha256'] or len(data)!=item['size_bytes']:
                          raise ValueError('Checksum mismatch: '+item['path'])
                      if destination.exists():
                          current=hashlib.sha256(destination.read_bytes()).hexdigest()
                          allowed=set(item['previous_sha256'])|{digest}
                          if current not in allowed:
                              raise ValueError('File changed outside the supported releases; no files were replaced: '+item['path'])
                      elif None not in item['previous_sha256']:
                          raise ValueError('A required base file is missing: '+item['path'])
                      payload.append((relative,data))
                  if set(names)!=expected:
                      raise ValueError('Archive contains unlisted files.')
                  package=next((data for path,data in payload if str(path)=='package.json'),None)
                  if package is None or json.loads(package)['version']!=manifest['version']:
                      raise ValueError('Patch release metadata does not match.')
                  if check_only:
                      return {'verified_files':len(payload),'base_version':version,'release':manifest['version']}
                  temporary=Path(tempfile.mkdtemp(prefix='.busraj-patch-',dir=target.parent))
                  staged=temporary/'next'
                  old=temporary/'previous'
                  replacement_complete=False
                  try:
                      shutil.copytree(target,staged,symlinks=True,ignore=shutil.ignore_patterns('node_modules','.wrangler','.git'))
                      for relative,data in payload:
                          file=staged.joinpath(*relative.parts)
                          file.parent.mkdir(parents=True,exist_ok=True)
                          file.write_bytes(data)
                      if (staged/'wrangler.jsonc').read_bytes()!=(target/'wrangler.jsonc').read_bytes():
                          raise ValueError('Deployed Worker settings must remain unchanged.')
                      os.replace(target,old)
                      try:
                          os.replace(staged,target)
                          replacement_complete=True
                      except BaseException:
                          os.replace(old,target)
                          replacement_complete=True
                          raise
                  finally:
                      # Keep the only recoverable copy if even the rollback rename failed.
                      if old.exists() and not replacement_complete:
                          print('Recovery copy preserved at '+str(old),file=sys.stderr)
                      else:
                          shutil.rmtree(temporary,ignore_errors=True)
                  return {'applied_files':len(payload),'base_version':version,'release':manifest['version']}

          if __name__=='__main__':
              try:
                  result=apply_patch(sys.argv[1],sys.argv[2],len(sys.argv)>3 and sys.argv[3]=='--check')
                  print(json.dumps(result))
              except Exception as error:
                  print('Patch rejected: '+str(error),file=sys.stderr)
                  sys.exit(1)
          PATCH_PY
            rm -f -- "$UPLOAD_ZIP"
          else
            bash .github/scripts/apply-zip-update.sh "$UPLOAD_ZIP" tahadi-alabaqera-online-pro-fixed
          fi

      - name: Verify updater and game release
        if: steps.upload.outputs.zip != ''
        shell: bash
        run: |
          node --test .github/tests/*.test.mjs
          cd tahadi-alabaqera-online-pro-fixed
          node scripts/verify-worker-config.mjs
          bash ../.github/scripts/verify-project-update.sh .
          node scripts/refresh-checksums.mjs
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified update
        if: steps.upload.outputs.zip != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply verified game update"
          git pull --rebase origin main
          git push origin main
