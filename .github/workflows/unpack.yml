name: Busraj_Games_2.1_FIXED_ROOT_UPLOAD.zip
on:
  push:
    paths:
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract update
        run: |
          ZIP=$(find . -name "Busraj_Games_2.1_FIXED_ROOT_UPLOAD.zip" -print -quit)
          DIR=$(dirname "$ZIP")
          unzip -o "$ZIP" -d "$DIR"
          rm "$ZIP"

      - name: Save update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Busraj Games 2.0"
          git push
