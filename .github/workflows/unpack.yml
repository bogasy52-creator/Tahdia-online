name: Auto Update Game

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Unzip game update
        run: |
          GAME="tahadi-alabaqera-online-pro-fixed"

          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Updating game..."

          unzip -o "$ZIP" -d "$GAME"

          rm -f "$ZIP"

          echo "Game extracted successfully"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update game files" || echo "No changes"

          git push origin main
