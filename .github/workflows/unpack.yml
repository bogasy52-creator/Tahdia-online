name: Auto Update Game From ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP to game folder
        run: |
          GAME_FOLDER="tahadi-alabaqera-online-pro-fixed"

          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Updating game from $ZIP"

          mkdir -p "$GAME_FOLDER"

          unzip -o "$ZIP" -d "$GAME_FOLDER"

          rm -f "$ZIP"

          echo "Game updated successfully"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update game files" || echo "No changes"

          git push
