name: Auto Unpack ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 0
          fi

          mkdir extracted
          unzip -o "$ZIP" -d extracted

          cp -r extracted/* .

          rm -rf extracted
          rm "$ZIP"

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"

          git add .
          git commit -m "Auto extract ZIP" || exit 0
          git push
