name: Auto Update Game

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/unpack.yml"
      - ".github/scripts/find-uploaded-zip.sh"
      - ".github/scripts/verify-project-update.sh"

permissions:
  contents: write

concurrency:
  group: automatic-zip-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: upload
        shell: bash
        run: |
          ZIP=$(bash .github/scripts/find-uploaded-zip.sh)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Apply ZIP update
        shell: bash
        run: bash .github/scripts/apply-zip-update.sh "${{ steps.upload.outputs.zip }}" tahadi-alabaqera-online-pro-fixed

      - name: Refresh checksums and verify project
        working-directory: tahadi-alabaqera-online-pro-fixed
        shell: bash
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"),file="SHA256SUMS.txt";const lines=fs.readFileSync(file,"utf8").trimEnd().split("\n");const next=lines.map(line=>{const name=line.slice(66);const hash=crypto.createHash("sha256").update(fs.readFileSync(name)).digest("hex");return hash+"  "+name});fs.writeFileSync(file,next.join("\n")+"\n")'
          bash ../.github/scripts/verify-project-update.sh .
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # apply-zip-update.sh removes the upload after extraction. Stage the
          # verified project and that deletion together, leaving no ZIP behind.
          git add -A -- .
          git commit -m "Auto update game files"
          git pull --rebase origin main
          git push origin main
