name: Auto Unpack ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP inside project folder
        run: |
          PROJECT_DIR="tahadi-alabaqera-online-pro-fixed"

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 0
          fi

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Project folder not found"
            exit 1
          fi

          unzip -o "$ZIP" -d "$PROJECT_DIR"

          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update project files" || echo "No changes"

          git push        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"

          git add .
          git commit -m "Auto extract ZIP" || exit 0
          git push
