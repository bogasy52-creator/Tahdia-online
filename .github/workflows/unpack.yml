name: Unpack ZIP Project

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Move files to root
        run: |
          cp -r extracted/* .
          rm -rf extracted
          rm -f "${{ steps.zip.outputs.zip }}"

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Auto unpack ZIP project" || echo "No changes"
          git push
