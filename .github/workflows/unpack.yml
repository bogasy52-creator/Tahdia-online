name: Auto Unpack ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir unzip_temp
          unzip -o *.zip -d unzip_temp
          cp -r unzip_temp/* .
          rm -rf unzip_temp
          rm -f *.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"
          git add .
          git commit -m "Auto extract project files" || exit 0
          git push
