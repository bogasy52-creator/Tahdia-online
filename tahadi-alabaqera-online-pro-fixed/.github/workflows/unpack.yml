name: Install Busraj Games Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract update
        run: |
          ZIP=$(find . -name "Busraj_Games_2.0_READY_TO_UPLOAD.zip" -print -quit)
          DIR=$(dirname "$ZIP")
          echo "Update found in: $DIR"
          unzip -o "$ZIP" -d "$DIR"
          rm "$ZIP"

      - name: Save updated game
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Busraj Games 2.0"
          git push
