<p>كل واحد يلعب من جهازه: مواجهة سريعة، أو غرفة مع أصحابك تبدأ بمن حضر. وتكتمل المواجهة بمنافسين إضافيين عند الحاجة.</p>
<a id="goOnline" href="/online">افتح تحدي الأسئلة</a>

<script>
/* 33.0.0: the same-device quiz moved online. An old link (or a saved shortcut) lands
   here and goes on to /online, keeping the categories it carried. */
(function () {
  var q = new URLSearchParams(location.search), parts = [];
  if (q.get('categories')) parts.push('categories=' + encodeURIComponent(q.get('categories')));
  if (q.get('relay')) parts.push('teams=4');
  var target = '/online' + (parts.length ? '?' + parts.join('&') : '');
  document.getElementById('goOnline').href = target;
  location.replace(target);
})();
</script>
