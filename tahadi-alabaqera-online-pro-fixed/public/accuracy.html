<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/platform.css"><title>Accuracy Challenge</title><style>.box{max-width:520px;margin:20px auto;text-align:center;padding:25px}.target{font-size:80px;cursor:pointer;margin:30px}.score{font-size:24px;color:#f4c76d}</style></head><body class="bs-page"><main class="bs-shell"><a class="bs-back" href="/">← الرئيسية</a><section class="bs-panel box"><div style="font-size:60px">🎯</div><h1>Accuracy Challenge</h1><p>اضغط الهدف بأسرع وقت خلال 30 ثانية.</p><div class="score" id="score">0</div><div class="target" id="target">🎯</div><button class="bs-btn primary" onclick="start()">ابدأ</button><p id="time"></p><p id="best"></p></section></main><script>let s=0,t=30,timer;let bestScore=localStorage.getItem('accuracyBest')||0;function start(){s=0;t=30;best.textContent='أفضل نتيجة: '+bestScore;score.textContent=0;clearInterval(timer);timer=setInterval(()=>{t--;time.textContent='الوقت: '+t;if(t<=0){clearInterval(timer);if(s>bestScore){bestScore=s;localStorage.setItem('accuracyBest',s)};alert('انتهى التحدي نتيجتك '+s)}},1000)}target.onclick=()=>{s++;score.textContent=s;target.style.transform='scale(.8)';setTimeout(()=>target.style.transform='scale(1)',100)}</script></body></html>
