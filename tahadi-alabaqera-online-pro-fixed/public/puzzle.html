<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/platform.css"><link rel="stylesheet" href="assets/css/pro-theme-v6.css"><title>Puzzle</title><style>.game{max-width:520px;margin:20px auto;text-align:center;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px}.tile{aspect-ratio:1;border:0;border-radius:12px;font-size:28px;background:#232842;color:white;cursor:pointer}.tile.empty{background:transparent}.score{font-size:22px;color:#f4c76d}</style></head><body class="bs-page"><main class="bs-shell"><a class="bs-back" href="/">← الرئيسية</a><section class="bs-panel game"><div style="font-size:60px">🧩</div><h1>Puzzle Challenge</h1><p>رتب الأرقام من 1 إلى 8. حاول بأقل عدد من الحركات.</p><div id="best" class="score"></div><div class="score" id="score">حركات: 0</div><div class="grid" id="grid"></div><button class="bs-btn primary" onclick="start()">إعادة اللعب</button></section></main><script>let moves=0;let arr=[];let best=localStorage.getItem('puzzleBest')||'-';function start(){arr=[1,2,3,4,5,6,7,8,0].sort(()=>Math.random()-.5);moves=0;draw()}function draw(){best.textContent='أفضل نتيجة: '+best;grid.innerHTML='';arr.forEach((x,i)=>{let b=document.createElement('button');b.className='tile '+(!x?'empty':'');b.textContent=x||'';b.onclick=()=>move(i);grid.appendChild(b)});score.textContent='حركات: '+moves}function move(i){let e=arr.indexOf(0),ok=[e-1,e+1,e-3,e+3].includes(i);if(ok){[arr[i],arr[e]]=[arr[e],arr[i]];moves++;draw();if(arr.join(',')==='1,2,3,4,5,6,7,8,0')if(best==='-'||moves<Number(best)){best=moves;localStorage.setItem('puzzleBest',moves)};setTimeout(()=>alert('🏆 أحسنت! النتيجة: '+moves+' حركة'),100)}}start()</script></body></html>
