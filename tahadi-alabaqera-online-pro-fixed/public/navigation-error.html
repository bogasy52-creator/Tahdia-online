<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030407">
  <link rel="stylesheet" href="assets/css/platform.css">
  <title>استعادة المسار — تحدي العباقرة</title>
  <style>
    body{display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,rgba(88,224,229,.1),transparent 36%),#030407!important}
    .route-recovery{width:min(620px,100%);padding:clamp(28px,7vw,64px);border:1px solid rgba(199,211,226,.2);background:linear-gradient(145deg,rgba(16,20,27,.96),rgba(5,7,10,.98));box-shadow:0 35px 90px rgba(0,0,0,.55);clip-path:polygon(28px 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%,0 28px)}
    .route-code{color:#d6b46a;font-size:10px;font-weight:900;letter-spacing:2px}.route-recovery h1{margin:16px 0 10px;font-size:clamp(34px,8vw,58px);line-height:1}.route-recovery p{margin:0;color:#9da6b2;line-height:1.9}.route-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}.route-actions a{min-height:47px;padding:0 18px;display:flex;align-items:center;justify-content:center;border:1px solid #d6b46a;background:#d6b46a;color:#11100d;text-decoration:none;font-size:12px;font-weight:900}.route-actions a+a{background:transparent;color:#e4cf9d}
  </style>
</head>
<body class="bs-page">
  <main class="route-recovery">
    <span class="route-code">ROUTE RECOVERY // ONLINE</span>
    <h1>تعذر فتح الصفحة</h1>
    <p>المسار المطلوب غير متاح، لكن حسابك وتقدمك محفوظان. ارجع إلى قائمة الألعاب أو افتح اختيار المنافس من جديد.</p>
    <nav class="route-actions" aria-label="خيارات الاستعادة">
      <a href="/index.html">قائمة الألعاب</a>
      <a href="/matchmaking.html">اختيار لاعب حقيقي</a>
    </nav>
  </main>
</body>
</html>
