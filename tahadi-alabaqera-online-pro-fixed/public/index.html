
  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي العباقرة أونلاين - Luxury Edition</title>
    <!-- استدعاء خطوط عصرية ومتناسقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة الاحتفالات (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #0B0F19;
            --bg-card: rgba(19, 26, 42, 0.75);
            --border-gold: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --gold-primary: #FFD700;
            --gold-light: #FFEFA6;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-glow: rgba(255, 215, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(30, 58, 138, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }

        /* شريط العلوي (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            font-size: 24px;
            color: var(--gold-primary);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF 0%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .room-badge {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-primary);
        }

        /* لوحة معلومات اللاعبين (VS Section) */
        .vs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            gap: 10px;
        }

        .player-card {
            flex: 1;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .player-card.active {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid var(--gold-primary);
            color: #fff;
        }

        .player-info h3 {
            font-size: 14px;
            font-weight: 700;
        }

        .player-info p {
            font-size: 13px;
            color: var(--gold-primary);
            font-weight: 600;
        }

        .vs-badge {
            font-weight: 900;
            font-size: 16px;
            color: var(--gold-light);
            text-shadow: 0 0 10px var(--gold-primary);
            padding: 0 5px;
        }

        /* ساحة اللعب والأسئلة (Arena) */
        .arena-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            position: relative;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-category {
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 8px;
            color: var(--text-muted);
        }

        .timer-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: conic-gradient(var(--gold-primary) 0deg, rgba(255,255,255,0.1) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            position: relative;
        }

        .timer-box::before {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            background: var(--bg-deep);
            border-radius: 50%;
        }

        .timer-text {
            position: relative;
            z-index: 1;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* شبكة خيارات الإجابة */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px 20px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: var(--gold-primary);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10B981;
            color: #34D399;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.2);
            border-color: #EF4444;
            color: #F87171;
        }

        /* شريط التذييل وأزرار التحكم */
        footer {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #D4AF37 0%, #AA771C 100%);
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: #0B0F19;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-crown"></i>
            <h1>تحدي العباقرة</h1>
        </div>
        <div class="room-badge">
            <i class="fa-solid fa-door-open"></i> الغرفة: #9251
        </div>
    </header>

    <!-- معلومات المتنافسين -->
    <div class="vs-container">
        <div class="player-card active" id="player1">
            <div class="player-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="player-info">
                <h3>أنت (اللاعب)</h3>
                <p id="p1-score">نقاط: 120</p>
            </div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="player-card" id="player2">
            <div class="player-avatar" style="background: linear-gradient(135deg, #7c2d12, #dc2626);">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="player-info">
                <h3>البوت الذكي</h3>
                <p id="p2-score">نقاط: 90</p>
            </div>
        </div>
    </div>

    <!-- ساحة السؤال -->
    <main class="arena-card">
        <div class="question-header">
            <span class="question-category"><i class="fa-solid fa-layer-group"></i> ثقافة عامة</span>
            <div class="timer-box">
                <span class="timer-text" id="countdown">15</span>
            </div>
        </div>
        
        <div class="question-text" id="question-box">
            ما هي عاصمة دولة أستراليا التي تعد مركزاً إدارياً وسياسياً مهماً؟
        </div>

        <div class="options-grid" id="options-container">
            <button class="option-btn" onclick="selectOption(this, false)">أ) سيدني <i class="fa-regular fa-circle"></i></button>
            <button class="option-btn" onclick="selectOption(this, true)">ب) كانبرا <i class="fa-regular fa-circle"></i></button>
            <button class="option-btn" onclick="selectOption(this, false)">ج) ملبورن <i class="fa-regular fa-circle"></i></button>
            <button class="option-btn" onclick="selectOption(this, false)">د) بريزبان <i class="fa-regular fa-circle"></i></button>
        </div>
    </main>

    <!-- أزرار التحكم السفلي -->
    <footer>
        <button class="action-btn" onclick="triggerCelebration()">
            <i class="fa-solid fa-trophy"></i> احتفال الفوز
        </button>
        <button class="action-btn" style="background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1);" onclick="location.reload()">
            <i class="fa-solid fa-rotate-right"></i> سؤال جديد
        </button>
    </footer>

    <script>
        // تفاعل الأزرار وتأكيد الإجابة
        function selectOption(button, isCorrect) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.style.pointerEvents = 'none'; // تعطيل النقر المتكرر
            });

            if (isCorrect) {
                button.classList.add('correct');
                button.querySelector('i').className = "fa-solid fa-circle-check";
                triggerCelebration();
            } else {
                button.classList.add('wrong');
                button.querySelector('i').className = "fa-solid fa-circle-xmark";
                // إظهار الإجابة الصحيحة تلقائياً
                buttons.forEach(btn => {
                    if (btn.getAttribute('onclick').includes('true')) {
                        btn.classList.add('correct');
                    }
                });
            }
        }

        // تأثيرات الاحتفال بالفوز (Confetti)
        function triggerCelebration() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#FFD700', '#FFA500', '#3B82F6', '#10B981']
            });
        }

        // عداد تنازلي تجريبي
        let timeLeft = 15;
        const timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('countdown').innerText = "0";
            }
        }, 1000);
    </script>
</body>
</html>
