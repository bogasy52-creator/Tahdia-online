<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070812"><link rel="manifest" href="manifest.webmanifest"><title>تحدي النرد — بوسراج</title><style>
.dice-hero{min-height:250px;display:grid;place-items:center;position:relative;overflow:hidden}.dice-hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(240,185,74,.09);filter:blur(10px)}.dice-hero .die{width:130px;height:130px;border-radius:28px;padding:18px}.dice-hero .pip{width:20px;height:20px}.bank-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.turn-total{text-align:center;margin-top:10px}.turn-total strong{font-size:44px;color:var(--bs-gold);display:block}.round-rolls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.round-roll{padding:8px;border:1px solid var(--bs-line);border-radius:12px;text-align:center;color:var(--bs-muted)}.round-roll b{display:block;color:#fff;font-size:20px}.mode-note{padding:10px;border:1px solid var(--bs-line);border-radius:14px;background:#0b0f1e;color:var(--bs-muted);font-size:12px;line-height:1.7}@media(max-width:520px){.dice-hero .die{width:105px;height:105px}.round-rolls{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="assets/css/app-dice.css?v=19.0.0"></head><body class="bs-page board-game game-dice release-v14 suite-v16 suite-v17"><main class="bs-shell"><header class="bs-topbar"><a class="bs-brand" href="./"><span class="bs-mark">BS</span><span class="bs-brand-copy"><b>تحدي النرد</b><span>حظ + قرار</span></span></a><div class="bs-actions"><a class="journey-shortcut-v17" href="/journey" aria-label="رحلة النجوم وألعاب المراحل"><i aria-hidden="true">✦</i><span>المراحل</span></a><a class="coin-chip" href="/shop" aria-label="عملاتك والمتجر"><span data-career-coins>100</span></a><button class="bs-icon-btn" data-audio-toggle>🔊</button><button class="bs-icon-btn" data-settings-open>⚙️</button><a class="bs-icon-btn" href="./" style="text-decoration:none">⌂</a></div></header>
<section id="setup" class="bs-panel setup-wrap"><h1 class="bs-title" style="font-size:34px">اختار نمط النرد</h1><p class="bs-subtitle">مباراة سريعة بأعلى رمية، أو سباق نقاط فيه مخاطرة: كمل ترمي أو ثبّت نقاطك قبل ما يطلع 1.</p><div class="setup-grid" style="margin-top:14px"><label class="bs-field"><span>المنافسة</span><select id="opponents"><option value="friends">لاعبون على نفس الجهاز</option><option value="bot">أنت ضد البوت</option></select></label><label class="bs-field"><span>مستوى البوت</span><select id="difficulty"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option></select></label><label class="bs-field"><span>النمط</span><select id="mode"><option value="race">سباق إلى 50</option><option value="highest">أعلى رمية</option></select></label><label class="bs-field"><span id="limitLabel">هدف النقاط</span><select id="limit"><option value="30">30</option><option value="50" selected>50</option><option value="75">75</option><option value="100">100</option></select></label><label class="bs-field"><span>عدد اللاعبين</span><select id="playerCount"><option>2</option><option>3</option><option selected>4</option></select></label><div></div><label class="bs-field"><span>اللاعب الأول</span><input id="n0" value="اللاعب الأول"></label><label class="bs-field"><span>اللاعب الثاني</span><input id="n1" value="اللاعب الثاني"></label><label class="bs-field"><span>اللاعب الثالث</span><input id="n2" value="اللاعب الثالث"></label><label class="bs-field"><span>اللاعب الرابع</span><input id="n3" value="اللاعب الرابع"></label></div><div id="modeHelp" class="mode-note" style="margin-top:12px"></div><div class="setup-actions"><button id="startBtn" class="bs-btn gold">ابدأ</button></div></section>
<section id="game" class="hidden"><div class="game-toolbar"><div class="toolbar-title"><h1 id="gameTitle">تحدي النرد</h1><p id="gameSub"></p></div><button id="restart" class="bs-btn">إعادة</button></div><div class="game-layout"><section class="bs-panel game-main"><div class="dice-hero"><div id="die" class="die" data-value="1"><i class="pip p1"></i><i class="pip p2"></i><i class="pip p3"></i><i class="pip p4"></i><i class="pip p5"></i><i class="pip p6"></i><i class="pip p7"></i><i class="pip p8"></i><i class="pip p9"></i></div></div><div id="turnTotal" class="turn-total"><span class="mini-note">نقاط هذه الجولة</span><strong>0</strong></div><div id="roundRolls" class="round-rolls hidden"></div></section><aside class="bs-panel game-side"><div id="players" class="player-list"></div><div id="status" class="game-status"></div><div class="bank-row"><button id="roll" class="bs-btn primary primary-action">🎲 ارْمِ</button><button id="bank" class="bs-btn gold primary-action">ثبّت النقاط</button></div><details class="rules bs-panel" style="padding:11px;margin-top:10px"><summary>القواعد</summary><ul id="rulesList"></ul></details></aside></div></section></main><div id="winnerOverlay" class="winner-overlay" role="dialog" aria-modal="true" aria-label="نتيجة المباراة"><div class="bs-panel winner-card"><div class="winner-icon">🎲🏆</div><h2 id="winnerName"></h2><p id="winnerText"></p><button id="again" class="bs-btn gold">العب مرة ثانية</button></div></div><div class="bs-toast"></div><script src="assets/js/audio-manager.js?v=19.0.0"></script><script src="assets/js/platform.js?v=19.0.0"></script><script src="assets/js/pro-dice.js?v=19.0.0"></script><script type="module">
import {shouldBankDice} from './assets/js/engines/bot-strategy.js?v=19.0.0';
import {createRaceDiceGame,rollRaceDice,bankRaceDice,createHighestDiceGame,scoreHighestRound} from './assets/js/engines/dice-engine.js?v=19.0.0';
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const $=s=>document.querySelector(s),colors=['#8b5cf6','#22d3ee','#f0b94a','#22c55e'];let state=null,mode='race',highestTurn=0,roundRolls=[],busy=false,receipt=(window.BS_UUID?.()||String(Date.now())+Math.random()),rewarded=false,bots=[],difficulty='medium',botBusy=false,localConfig=null,pendingDie=null;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function getNames(){const bot=$('#opponents').value==='bot',c=bot?2:Number($('#playerCount').value);bots=bot?[1]:[];return Array.from({length:c},(_,i)=>bots.includes(i)?'البوت':$('#n'+i).value.trim()||`لاعب ${i+1}`)}
function updateSetup(){const highest=$('#mode').value==='highest';$('#limitLabel').textContent=highest?'عدد الجولات':'هدف النقاط';$('#limit').innerHTML=highest?'<option value="3">3 جولات</option><option value="5" selected>5 جولات</option><option value="7">7 جولات</option><option value="10">10 جولات</option>':'<option value="30">30</option><option value="50" selected>50</option><option value="75">75</option><option value="100">100</option>';$('#modeHelp').textContent=highest?'كل لاعب يرمي مرة في الجولة. أعلى رمية تأخذ نقطة، وإذا تعادل الأعلى يأخذ كل المتعادلين نقطة.':'كل رمية تضيف لنقاط دورك. إذا ظهر 1 تخسر نقاط الدور وينتقل اللعب. اضغط «ثبّت» لحفظ النقاط وانتقال الدور.'}
function renderPlayers(){const box=$('#players');box.innerHTML='';state.players.forEach((p,i)=>{const active=mode==='race'?state.turn===i:highestTurn===i;const row=document.createElement('div');row.className='player-row '+(!finished()&&active?'turn':'');row.innerHTML=`<i class="player-dot" style="background:${colors[i]}"></i><div><b>${escHtml(p.name)}</b><div class="mini-note">${mode==='race'?'المجموع':'نقاط الجولات'}</div></div><span class="score">${p.score}</span>`;box.appendChild(row)})}
function finished(){return mode==='race'?state.winner!==null:state.finished}
function render(){renderPlayers();const ai=bots.includes(mode==='race'?state.turn:highestTurn);$('#roll').disabled=busy||ai||finished()||window.BS_PRO?.paused;$('#restart').disabled=busy||botBusy;if(mode==='race'){const p=state.players[state.turn];$('#status').textContent=`الدور: ${p.name} — ارْمِ أو ثبّت نقاطك`;$(`#turnTotal strong`).textContent=state.turnTotal;$('#turnTotal').classList.remove('hidden');$('#roundRolls').classList.add('hidden');$('#bank').classList.remove('hidden');$('#bank').disabled=busy||ai||state.turnTotal===0||finished()||window.BS_PRO?.paused}else{$('#turnTotal').classList.add('hidden');$('#roundRolls').classList.remove('hidden');$('#bank').classList.add('hidden');$('#status').textContent=`الجولة ${Math.min(state.round+1,state.rounds)} من ${state.rounds} — دور ${state.players[highestTurn].name}`;$('#roundRolls').innerHTML=state.players.map((p,i)=>`<div class="round-roll"><span>${escHtml(p.name)}</span><b>${roundRolls[i]??'—'}</b></div>`).join('')}if(finished())showWinner()}
function showWinner(){if(!rewarded){rewarded=true;BS_AUDIO.play('win');BS_AUDIO.vibrate([80,50,160]);(window.BS_PRO?.record||window.BS_CAREER?.record)?.({id:receipt,game:'dice',win:mode==='race'?state.winner===0:state.winners.includes(0)})}let names;if(mode==='race')names=[state.players[state.winner].name];else names=state.winners.map(i=>state.players[i].name);$('#winnerName').textContent=names.join(' + ');$('#winnerText').textContent=names.length>1?'انتهت المباراة بالتعادل في الصدارة.':'حسم تحدي النرد!';$('#winnerOverlay').classList.add('show');}
function rand(){return window.BS_DICE.random()}
async function rollVisual(){const r=pendingDie??rand();pendingDie=r;saveDice();await window.BS_DICE.roll($('#die'),r);await window.BS_PRO?.waitForPlay?.();return r}
$('#roll').onclick=async()=>{if(busy||finished()||bots.includes(mode==='race'?state.turn:highestTurn)||window.BS_PRO?.paused)return;busy=true;$('#roll').disabled=true;$('#bank').disabled=true;$('#restart').disabled=true;try{const r=await rollVisual();if(mode==='race'){const before=state.turn;state=rollRaceDice(state,r);if(r===1){BS_AUDIO.play('wrong');BS_PLATFORM.toast(`طلع 1 — ضاعت نقاط دور ${state.players[before].name}`)}}else{roundRolls[highestTurn]=r;highestTurn++;if(highestTurn>=state.players.length){state=scoreHighestRound(state,roundRolls);const max=Math.max(...roundRolls);BS_PLATFORM.toast(`أعلى رمية في الجولة: ${max}`);roundRolls=Array(state.players.length).fill(null);highestTurn=0;BS_AUDIO.play('correct')}}pendingDie=null;saveDice();render()}catch(e){BS_PLATFORM.toast('تعذر الرمي: '+e.message)}finally{busy=false;$('#roll').disabled=finished();$('#restart').disabled=false;render();saveDice();runDiceBots()}};
$('#bank').onclick=()=>{if(busy||finished()||state.turnTotal<=0||bots.includes(state.turn)||window.BS_PRO?.paused)return;BS_AUDIO.play('correct');state=bankRaceDice(state);render();saveDice();runDiceBots()};
function start(){if(busy||botBusy)return;receipt=(window.BS_UUID?.()||String(Date.now())+Math.random());rewarded=false;pendingDie=null;difficulty=$('#difficulty').value;localConfig=Object.fromEntries(['opponents','difficulty','playerCount','mode','limit','n0','n1','n2','n3'].map(id=>[id,$('#'+id).value]));document.body.classList.add('game-running');mode=$('#mode').value;const ns=getNames(),limit=Number($('#limit').value);state=mode==='race'?createRaceDiceGame(ns,limit):createHighestDiceGame(ns,limit);highestTurn=0;roundRolls=Array(ns.length).fill(null);$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#winnerOverlay').classList.remove('show');$('#gameTitle').textContent=mode==='race'?'سباق النرد':'أعلى رمية';$('#gameSub').textContent=mode==='race'?`أول لاعب يثبت ${state.target} نقطة يفوز`:`${state.rounds} جولات — الأعلى يجمع نقاط الفوز`;$('#rulesList').innerHTML=mode==='race'?'<li>ارْمِ أكثر من مرة لزيادة نقاط دورك.</li><li>إذا ظهر 1 تخسر نقاط الدور غير المثبتة.</li><li>اضغط ثبّت لحفظ نقاط الدور.</li>':'<li>كل لاعب يرمي مرة في كل جولة.</li><li>أعلى رمية تأخذ نقطة.</li><li>التعادل في أعلى رمية يعطي كل المتعادلين نقطة.</li>';render();saveDice();BS_AUDIO.play('launch')}
async function runDiceBots(){
 if(botBusy||finished()||!bots.includes(mode==='race'?state.turn:highestTurn))return;
 botBusy=true;busy=true;render();
 try{while(!finished()&&bots.includes(mode==='race'?state.turn:highestTurn)){
  await window.BS_PRO?.waitForPlay?.();await wait(550);await window.BS_PRO?.waitForPlay?.();
  if(mode==='race'&&pendingDie===null&&shouldBankDice(state,difficulty)){state=bankRaceDice(state);BS_AUDIO.play('correct')}
  else{const roll=await rollVisual();if(mode==='race')state=rollRaceDice(state,roll);else{
   roundRolls[highestTurn]=roll;highestTurn++;
   if(highestTurn>=state.players.length){state=scoreHighestRound(state,roundRolls);roundRolls=Array(state.players.length).fill(null);highestTurn=0}
  }pendingDie=null;}saveDice();render();
 }}finally{botBusy=false;busy=false;render();saveDice()}
}
function saveDice(){try{if(state&&!finished())localStorage.setItem('busraj-dice-v7',JSON.stringify({state,mode,highestTurn,roundRolls,receipt,bots,difficulty,pendingDie,config:localConfig}));else if(state)localStorage.removeItem('busraj-dice-v7')}catch{}}
window.addEventListener('bs-match-pause',()=>{if(state&&!busy)render()});
window.addEventListener('pagehide',saveDice);
const savedDice=(()=>{try{return JSON.parse(localStorage.getItem('busraj-dice-v7')||'null')}catch{return null}})();
if(savedDice?.state?.players?.length>=2&&['race','highest'].includes(savedDice.mode)&&savedDice.state.players.every(p=>Number.isFinite(p.score)&&p.score>=0)&&((savedDice.mode==='race'&&Number.isInteger(savedDice.state.turn)&&savedDice.state.turn>=0&&savedDice.state.turn<savedDice.state.players.length&&savedDice.state.winner===null)||(savedDice.mode==='highest'&&Number.isInteger(savedDice.highestTurn)&&savedDice.highestTurn>=0&&savedDice.highestTurn<savedDice.state.players.length&&!savedDice.state.finished))){const resume=document.createElement('button');resume.className='bs-btn resume-btn';resume.textContent='متابعة تحدّي النرد';$('#startBtn').after(resume);resume.onclick=()=>{state=savedDice.state;mode=savedDice.mode;highestTurn=savedDice.highestTurn;roundRolls=savedDice.roundRolls;receipt=savedDice.receipt;pendingDie=Number.isInteger(savedDice.pendingDie)&&savedDice.pendingDie>=1&&savedDice.pendingDie<=6?savedDice.pendingDie:null;bots=savedDice.bots||[];difficulty=savedDice.difficulty||'medium';localConfig=savedDice.config;for(const [id,value]of Object.entries(localConfig||{}))if($('#'+id))$('#'+id).value=value;document.body.classList.add('game-running');$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#gameTitle').textContent=mode==='race'?'سباق النرد':'أعلى رمية';$('#gameSub').textContent=mode==='race'?`أول لاعب يثبت ${state.target} نقطة يفوز`:`${state.rounds} جولات`;render();if(pendingDie!==null&&!bots.includes(mode==='race'?state.turn:highestTurn))$('#roll').onclick();else runDiceBots()}}
$('#mode').onchange=updateSetup;updateSetup();function updateDiceSetup(){const bot=$('#opponents').value==='bot',c=bot?1:Number($('#playerCount').value);for(let i=0;i<4;i++)$('#n'+i).closest('label').classList.toggle('hidden',i>=c);$('#difficulty').closest('label').classList.toggle('hidden',!bot);$('#playerCount').closest('label').classList.toggle('hidden',bot)}$('#opponents').onchange=updateDiceSetup;$('#playerCount').onchange=updateDiceSetup;;$('#playerCount').dispatchEvent(new Event('change'));$('#startBtn').onclick=start;$('#restart').onclick=start;$('#again').onclick=start;
</script><script src="assets/js/profile-core.js?v=19.0.0"></script><script src="assets/js/career-client.js?v=19.0.0"></script><script src="assets/js/royal-stones.js?v=19.0.0"></script><script src="assets/js/serpent-art-v16.js?v=19.0.0"></script><script src="assets/js/cosmetic-art.js?v=19.0.0"></script><script src="assets/js/ui-icons.js?v=19.0.0"></script><script src="assets/js/pro-experience.js?v=19.0.0"></script><script defer src="assets/js/client-health.js?v=19.0.0"></script></body></html>
