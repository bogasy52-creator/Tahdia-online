<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070812"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/platform.css"><link rel="stylesheet" href="assets/css/game-kit.css"><title>تحدي النرد — بوسراج</title><style>
.dice-hero{min-height:250px;display:grid;place-items:center;position:relative;overflow:hidden}.dice-hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(240,185,74,.09);filter:blur(10px)}.dice-hero .die{width:130px;height:130px;border-radius:28px;padding:18px}.dice-hero .pip{width:20px;height:20px}.bank-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.turn-total{text-align:center;margin-top:10px}.turn-total strong{font-size:44px;color:var(--bs-gold);display:block}.round-rolls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.round-roll{padding:8px;border:1px solid var(--bs-line);border-radius:12px;text-align:center;color:var(--bs-muted)}.round-roll b{display:block;color:#fff;font-size:20px}.mode-note{padding:10px;border:1px solid var(--bs-line);border-radius:14px;background:#0b0f1e;color:var(--bs-muted);font-size:12px;line-height:1.7}@media(max-width:520px){.dice-hero .die{width:105px;height:105px}.round-rolls{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="bs-page"><main class="bs-shell"><header class="bs-topbar"><a class="bs-brand" href="./"><span class="bs-mark">BS</span><span class="bs-brand-copy"><b>تحدي النرد</b><span>حظ + قرار</span></span></a><div class="bs-actions"><button class="bs-icon-btn" data-audio-toggle>🔊</button><button class="bs-icon-btn" data-settings-open>⚙️</button><a class="bs-icon-btn" href="./" style="text-decoration:none">⌂</a></div></header>
<section id="setup" class="bs-panel setup-wrap"><h1 class="bs-title" style="font-size:34px">اختار نمط النرد</h1><p class="bs-subtitle">مباراة سريعة بأعلى رمية، أو سباق نقاط فيه مخاطرة: كمل ترمي أو ثبّت نقاطك قبل ما يطلع 1.</p><div class="setup-grid" style="margin-top:14px"><label class="bs-field"><span>النمط</span><select id="mode"><option value="race">سباق إلى 50</option><option value="highest">أعلى رمية</option></select></label><label class="bs-field"><span id="limitLabel">هدف النقاط</span><select id="limit"><option value="30">30</option><option value="50" selected>50</option><option value="75">75</option><option value="100">100</option></select></label><label class="bs-field"><span>عدد اللاعبين</span><select id="playerCount"><option>2</option><option>3</option><option selected>4</option></select></label><div></div><label class="bs-field"><span>اللاعب الأول</span><input id="n0" value="اللاعب الأول"></label><label class="bs-field"><span>اللاعب الثاني</span><input id="n1" value="اللاعب الثاني"></label><label class="bs-field"><span>اللاعب الثالث</span><input id="n2" value="اللاعب الثالث"></label><label class="bs-field"><span>اللاعب الرابع</span><input id="n3" value="اللاعب الرابع"></label></div><div id="modeHelp" class="mode-note" style="margin-top:12px"></div><div class="setup-actions"><button id="startBtn" class="bs-btn gold">ابدأ</button></div></section>
<section id="game" class="hidden"><div class="game-toolbar"><div class="toolbar-title"><h1 id="gameTitle">تحدي النرد</h1><p id="gameSub"></p></div><button id="restart" class="bs-btn">إعادة</button></div><div class="game-layout"><section class="bs-panel game-main"><div class="dice-hero"><div id="die" class="die" data-value="1"><i class="pip p1"></i><i class="pip p2"></i><i class="pip p3"></i><i class="pip p4"></i><i class="pip p5"></i><i class="pip p6"></i><i class="pip p7"></i><i class="pip p8"></i><i class="pip p9"></i></div></div><div id="turnTotal" class="turn-total"><span class="mini-note">نقاط هذه الجولة</span><strong>0</strong></div><div id="roundRolls" class="round-rolls hidden"></div></section><aside class="bs-panel game-side"><div id="players" class="player-list"></div><div id="status" class="game-status"></div><div class="bank-row"><button id="roll" class="bs-btn primary primary-action">🎲 ارْمِ</button><button id="bank" class="bs-btn gold primary-action">ثبّت النقاط</button></div><details class="rules bs-panel" style="padding:11px;margin-top:10px"><summary>القواعد</summary><ul id="rulesList"></ul></details></aside></div></section></main><div id="winnerOverlay" class="winner-overlay"><div class="bs-panel winner-card"><div class="winner-icon">🎲🏆</div><h2 id="winnerName"></h2><p id="winnerText"></p><button id="again" class="bs-btn gold">العب مرة ثانية</button></div></div><div class="bs-toast"></div><script src="assets/js/audio-manager.js"></script><script src="assets/js/platform.js"></script>
<script src="assets/js/engines/dice-engine.js"></script><script type="module">
import {createRaceDiceGame,rollRaceDice,bankRaceDice,createHighestDiceGame,scoreHighestRound} from './assets/js/engines/dice-engine.js';
const $=s=>document.querySelector(s),colors=['#8b5cf6','#22d3ee','#f0b94a','#22c55e'];let state=null,mode='race',highestTurn=0,roundRolls=[],busy=false;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function getNames(){const c=Number($('#playerCount').value);return Array.from({length:c},(_,i)=>$('#n'+i).value.trim()||`لاعب ${i+1}`)}
function updateSetup(){const highest=$('#mode').value==='highest';$('#limitLabel').textContent=highest?'عدد الجولات':'هدف النقاط';$('#limit').innerHTML=highest?'<option value="3">3 جولات</option><option value="5" selected>5 جولات</option><option value="7">7 جولات</option><option value="10">10 جولات</option>':'<option value="30">30</option><option value="50" selected>50</option><option value="75">75</option><option value="100">100</option>';$('#modeHelp').textContent=highest?'كل لاعب يرمي مرة في الجولة. أعلى رمية تأخذ نقطة، وإذا تعادل الأعلى يأخذ كل المتعادلين نقطة.':'كل رمية تضيف لنقاط دورك. إذا ظهر 1 تخسر نقاط الدور وينتقل اللعب. اضغط «ثبّت» لحفظ النقاط وانتقال الدور.'}
function renderPlayers(){const box=$('#players');box.innerHTML='';state.players.forEach((p,i)=>{const active=mode==='race'?state.turn===i:highestTurn===i;const row=document.createElement('div');row.className='player-row '+(!finished()&&active?'turn':'');row.innerHTML=`<i class="player-dot" style="background:${colors[i]}"></i><div><b>${p.name}</b><div class="mini-note">${mode==='race'?'المجموع':'نقاط الجولات'}</div></div><span class="score">${p.score}</span>`;box.appendChild(row)})}
function finished(){return mode==='race'?state.winner!==null:state.finished}
function render(){renderPlayers();if(mode==='race'){const p=state.players[state.turn];$('#status').textContent=`الدور: ${p.name} — ارْمِ أو ثبّت نقاطك`;$(`#turnTotal strong`).textContent=state.turnTotal;$('#turnTotal').classList.remove('hidden');$('#roundRolls').classList.add('hidden');$('#bank').classList.remove('hidden');$('#bank').disabled=state.turnTotal===0}else{$('#turnTotal').classList.add('hidden');$('#roundRolls').classList.remove('hidden');$('#bank').classList.add('hidden');$('#status').textContent=`الجولة ${Math.min(state.round+1,state.rounds)} من ${state.rounds} — دور ${state.players[highestTurn].name}`;$('#roundRolls').innerHTML=state.players.map((p,i)=>`<div class="round-roll"><span>${p.name}</span><b>${roundRolls[i]??'—'}</b></div>`).join('')}if(finished())showWinner()}
function showWinner(){let names;if(mode==='race')names=[state.players[state.winner].name];else names=state.winners.map(i=>state.players[i].name);$('#winnerName').textContent=names.join(' + ');$('#winnerText').textContent=names.length>1?'انتهت المباراة بالتعادل في الصدارة.':'حسم تحدي النرد!';$('#winnerOverlay').classList.add('show');BS_AUDIO.play('win');BS_AUDIO.vibrate([80,50,160])}
function rand(){return Math.floor(Math.random()*6)+1}
async function rollVisual(){const die=$('#die');die.classList.remove('rolling');void die.offsetWidth;die.classList.add('rolling');BS_AUDIO.play('dice');await wait(420);const r=rand();die.dataset.value=r;BS_AUDIO.vibrate(24);return r}
$('#roll').onclick=async()=>{if(busy||finished())return;busy=true;$('#roll').disabled=true;const r=await rollVisual();if(mode==='race'){const before=state.turn;state=rollRaceDice(state,r);if(r===1){BS_AUDIO.play('wrong');BS_PLATFORM.toast(`طلع 1 — ضاعت نقاط دور ${state.players[before].name}`)}}else{roundRolls[highestTurn]=r;highestTurn++;if(highestTurn>=state.players.length){state=scoreHighestRound(state,roundRolls);const max=Math.max(...roundRolls);BS_PLATFORM.toast(`أعلى رمية في الجولة: ${max}`);roundRolls=Array(state.players.length).fill(null);highestTurn=0;BS_AUDIO.play('correct')}}render();busy=false;$('#roll').disabled=finished()};
$('#bank').onclick=()=>{if(state.turnTotal<=0)return;BS_AUDIO.play('correct');state=bankRaceDice(state);render()};
function start(){mode=$('#mode').value;const ns=getNames(),limit=Number($('#limit').value);state=mode==='race'?createRaceDiceGame(ns,limit):createHighestDiceGame(ns,limit);highestTurn=0;roundRolls=Array(ns.length).fill(null);$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#winnerOverlay').classList.remove('show');$('#gameTitle').textContent=mode==='race'?'سباق النرد':'أعلى رمية';$('#gameSub').textContent=mode==='race'?`أول لاعب يثبت ${state.target} نقطة يفوز`:`${state.rounds} جولات — الأعلى يجمع نقاط الفوز`;$('#rulesList').innerHTML=mode==='race'?'<li>ارْمِ أكثر من مرة لزيادة نقاط دورك.</li><li>إذا ظهر 1 تخسر نقاط الدور غير المثبتة.</li><li>اضغط ثبّت لحفظ نقاط الدور.</li>':'<li>كل لاعب يرمي مرة في كل جولة.</li><li>أعلى رمية تأخذ نقطة.</li><li>التعادل في أعلى رمية يعطي كل المتعادلين نقطة.</li>';render();BS_AUDIO.play('launch')}
$('#mode').onchange=updateSetup;updateSetup();$('#playerCount').onchange=()=>{const c=Number($('#playerCount').value);for(let i=0;i<4;i++)$('#n'+i).closest('label').classList.toggle('hidden',i>=c)};$('#playerCount').dispatchEvent(new Event('change'));$('#startBtn').onclick=start;$('#restart').onclick=start;$('#again').onclick=start;
</script></body></html>
